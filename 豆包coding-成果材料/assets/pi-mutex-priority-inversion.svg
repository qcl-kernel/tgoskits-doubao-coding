<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">无 PI mutex 时的确定性优先级反转</title>
  <desc id="svg-desc">低优先级任务持锁，高优先级任务等待该锁，中优先级任务持续运行，导致低优先级 owner 和高优先级 waiter 都无法推进。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 17px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 14px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .lane { stroke-width: 1.8; rx: 12; ry: 12; }
      .event { stroke-width: 1.5; rx: 8; ry: 8; }
      .time { stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .wait { stroke: #dc2626; stroke-width: 4; stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1180" height="520" fill="#f8fafc"/>
  <line x1="175" y1="55" x2="1125" y2="55" class="time"/>
  <text x="150" y="60" text-anchor="end" class="small">时间</text>

  <rect x="25" y="85" width="1130" height="105" class="lane" fill="#eff6ff" stroke="#3b82f6"/>
  <rect x="25" y="210" width="1130" height="105" class="lane" fill="#fff7ed" stroke="#f97316"/>
  <rect x="25" y="335" width="1130" height="105" class="lane" fill="#f0fdf4" stroke="#22c55e"/>

  <text x="105" y="125" text-anchor="middle" class="label">H · 高优先级</text>
  <text x="105" y="151" text-anchor="middle" class="small">mutex waiter</text>
  <text x="105" y="250" text-anchor="middle" class="label">M · 中优先级</text>
  <text x="105" y="276" text-anchor="middle" class="small">持续 runnable</text>
  <text x="105" y="375" text-anchor="middle" class="label">L · 低优先级</text>
  <text x="105" y="401" text-anchor="middle" class="small">mutex owner</text>

  <line x1="175" y1="85" x2="175" y2="440" class="dash"/>
  <line x1="350" y1="85" x2="350" y2="440" class="dash"/>
  <line x1="540" y1="85" x2="540" y2="440" class="dash"/>
  <line x1="735" y1="85" x2="735" y2="440" class="dash"/>

  <rect x="195" y="360" width="135" height="54" class="event" fill="#dbeafe" stroke="#2563eb"/>
  <text x="262" y="382" text-anchor="middle" class="body">L 获取 mutex</text>
  <text x="262" y="402" text-anchor="middle" class="small">owner = L</text>

  <rect x="370" y="110" width="150" height="54" class="event" fill="#fee2e2" stroke="#dc2626"/>
  <text x="445" y="132" text-anchor="middle" class="body">H 请求 mutex</text>
  <text x="445" y="152" text-anchor="middle" class="small">被阻塞</text>
  <path d="M445 164 V360" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="462" y="270" class="small">等待 L 释放</text>

  <rect x="560" y="235" width="155" height="54" class="event" fill="#dcfce7" stroke="#16a34a"/>
  <text x="637" y="257" text-anchor="middle" class="body">M 开始运行</text>
  <text x="637" y="277" text-anchor="middle" class="small">保持 runnable</text>

  <rect x="755" y="235" width="345" height="54" class="event" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="927" y="257" text-anchor="middle" class="body">RT FIFO 持续选择 M</text>
  <text x="927" y="277" text-anchor="middle" class="small">priority(M) &gt; priority(L)</text>

  <line x1="735" y1="387" x2="1100" y2="387" class="wait"/>
  <text x="917" y="375" text-anchor="middle" class="body">L 得不到 CPU，无法执行 unlock</text>

  <line x1="540" y1="137" x2="1100" y2="137" class="wait"/>
  <text x="820" y="125" text-anchor="middle" class="body">H 长时间等待，无法完成实时工作</text>

  <rect x="315" y="465" width="550" height="38" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="590" y="489" text-anchor="middle" class="label">无 PI：M 间接阻塞 H，形成无界优先级反转</text>
</svg>
