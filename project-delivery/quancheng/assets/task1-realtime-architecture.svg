<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">任务一整体技术架构</title>
  <desc id="desc">编译期实时核配置经过 SMP 初始化形成虚拟化域和实时域，两个域通过有界命令通信，并由 spin-noirq 检测和实时指标观测提供横向治理。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 28px sans-serif; fill: #fff; }
      .subtitle { font: 14px sans-serif; fill: #dbeafe; }
      .section { font: 700 21px sans-serif; fill: #0f172a; }
      .label { font: 600 16px sans-serif; fill: #0f172a; }
      .small { font: 14px sans-serif; fill: #475569; }
      .white { font: 600 16px sans-serif; fill: #fff; }
      .domain { stroke-width: 2.5; rx: 18; ry: 18; }
      .card { stroke-width: 1.7; rx: 12; ry: 12; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="82" fill="url(#header)"/>
  <text x="600" y="38" text-anchor="middle" class="title">任务一：Axvisor 实时性与隔离整体技术架构</text>
  <text x="600" y="63" text-anchor="middle" class="subtitle">CPU 所有权隔离 · RT FIFO · PI mutex · timer/抢占可观测性</text>

  <rect x="360" y="105" width="480" height="70" class="card" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="600" y="134" text-anchor="middle" class="label">编译期配置：realtime_cpu_id</text>
  <text x="600" y="158" text-anchor="middle" class="small">指定唯一实时核；-1 表示关闭实时域</text>
  <path d="M600 175 V212" class="arrow"/>

  <rect x="330" y="215" width="540" height="62" class="card" fill="#f1f5f9" stroke="#64748b"/>
  <text x="600" y="241" text-anchor="middle" class="label">SMP 初始化：校验 CPU 拓扑并建立唯一所有权</text>
  <text x="600" y="263" text-anchor="middle" class="small">online/capacity/BSP 校验 · 派生 virtualization mask 与 realtime mask</text>

  <path d="M500 277 V309 H295 V335" class="arrow"/>
  <path d="M700 277 V309 H905 V335" class="arrow"/>

  <rect x="55" y="335" width="480" height="270" class="domain" fill="#eff6ff" stroke="#2563eb"/>
  <rect x="55" y="335" width="480" height="52" rx="16" ry="16" fill="#2563eb"/>
  <text x="295" y="368" text-anchor="middle" class="white">虚拟化域 · pCPU0..2</text>

  <rect x="85" y="410" width="195" height="72" class="card" fill="#fff" stroke="#60a5fa"/>
  <text x="182" y="439" text-anchor="middle" class="label">StarryOS vCPU</text>
  <text x="182" y="463" text-anchor="middle" class="small">AI / 文件系统 / 网络</text>

  <rect x="310" y="410" width="195" height="72" class="card" fill="#fff" stroke="#60a5fa"/>
  <text x="407" y="439" text-anchor="middle" class="label">VM / I/O worker</text>
  <text x="407" y="463" text-anchor="middle" class="small">虚拟设备与管理任务</text>

  <rect x="85" y="505" width="195" height="72" class="card" fill="#fff" stroke="#60a5fa"/>
  <text x="182" y="534" text-anchor="middle" class="label">普通 IRQ</text>
  <text x="182" y="558" text-anchor="middle" class="small">网卡 / 块设备 / console</text>

  <rect x="310" y="505" width="195" height="72" class="card" fill="#fff" stroke="#60a5fa"/>
  <text x="407" y="534" text-anchor="middle" class="label">隔离约束</text>
  <text x="407" y="558" text-anchor="middle" class="small">不得进入实时 CPU mask</text>

  <rect x="665" y="335" width="480" height="270" class="domain" fill="#ecfdf5" stroke="#059669"/>
  <rect x="665" y="335" width="480" height="52" rx="16" ry="16" fill="#059669"/>
  <text x="905" y="368" text-anchor="middle" class="white">实时域 · pCPU3</text>

  <rect x="695" y="410" width="195" height="72" class="card" fill="#fff" stroke="#34d399"/>
  <text x="792" y="439" text-anchor="middle" class="label">RT FIFO</text>
  <text x="792" y="463" text-anchor="middle" class="small">高优先级抢占 / 同级 FIFO</text>

  <rect x="920" y="410" width="195" height="72" class="card" fill="#fff" stroke="#34d399"/>
  <text x="1017" y="439" text-anchor="middle" class="label">PI mutex</text>
  <text x="1017" y="463" text-anchor="middle" class="small">owner donation / unlock 恢复</text>

  <rect x="695" y="505" width="195" height="72" class="card" fill="#fff" stroke="#34d399"/>
  <text x="792" y="534" text-anchor="middle" class="label">RT timer / IRQ</text>
  <text x="792" y="558" text-anchor="middle" class="small">周期唤醒与设备事件</text>

  <rect x="920" y="505" width="195" height="72" class="card" fill="#fff" stroke="#34d399"/>
  <text x="1017" y="534" text-anchor="middle" class="label">实时控制任务</text>
  <text x="1017" y="558" text-anchor="middle" class="small">8ms balance loop</text>

  <path d="M535 460 H650" class="dash"/>
  <rect x="535" y="425" width="130" height="28" rx="14" fill="#fff7ed" stroke="#f97316"/>
  <text x="600" y="445" text-anchor="middle" class="small">有界控制命令</text>

  <rect x="155" y="635" width="890" height="58" class="card" fill="#fff7ed" stroke="#f97316"/>
  <text x="600" y="660" text-anchor="middle" class="label">横向治理：spin-noirq 长持锁检测与锁类型审计</text>
  <text x="600" y="682" text-anchor="middle" class="small">per-CPU timer 延迟 · 高优先级唤醒延迟 · P99 / max / deadline miss</text>
  <path d="M295 605 V635" class="arrow"/>
  <path d="M905 605 V635" class="arrow"/>
</svg>
