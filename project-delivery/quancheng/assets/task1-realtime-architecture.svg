<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Axvisor 实时性保障链</title>
  <desc id="svg-desc">智能侧干扰依次经过 CPU 所有权隔离、实时调度与优先级继承、关中断临界区治理，最终由实时指标验证。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 18px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 14px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .step { font: 700 22px Arial, sans-serif; fill: #fff; }
      .card { stroke-width: 2; rx: 16; ry: 16; }
      .inner { fill: #fff; stroke-width: 1.4; rx: 9; ry: 9; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 1.7; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>

  <!-- Interference sources -->
  <rect x="30" y="110" width="185" height="315" class="card" fill="#fff1f2" stroke="#e11d48"/>
  <circle cx="68" cy="148" r="20" fill="#e11d48"/>
  <text x="68" y="156" text-anchor="middle" class="step">0</text>
  <text x="122" y="153" text-anchor="middle" class="label">干扰输入</text>
  <rect x="52" y="185" width="140" height="50" class="inner" stroke="#fda4af"/>
  <text x="122" y="207" text-anchor="middle" class="body">Starry vCPU</text>
  <text x="122" y="225" text-anchor="middle" class="small">AI / 系统负载</text>
  <rect x="52" y="252" width="140" height="50" class="inner" stroke="#fda4af"/>
  <text x="122" y="274" text-anchor="middle" class="body">VM / I/O worker</text>
  <text x="122" y="292" text-anchor="middle" class="small">网络 / 存储 / console</text>
  <rect x="52" y="319" width="140" height="50" class="inner" stroke="#fda4af"/>
  <text x="122" y="341" text-anchor="middle" class="body">锁与中断</text>
  <text x="122" y="359" text-anchor="middle" class="small">竞争 / 长关中断</text>
  <text x="122" y="400" text-anchor="middle" class="small">需要逐层阻断</text>

  <path d="M215 267 H260" class="arrow"/>

  <!-- Layer 1 -->
  <rect x="265" y="70" width="260" height="395" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <circle cx="303" cy="110" r="22" fill="#2563eb"/>
  <text x="303" y="118" text-anchor="middle" class="step">1</text>
  <text x="395" y="116" text-anchor="middle" class="label">CPU 所有权隔离</text>
  <rect x="290" y="150" width="210" height="67" class="inner" stroke="#93c5fd"/>
  <text x="395" y="176" text-anchor="middle" class="body">build TOML</text>
  <text x="395" y="198" text-anchor="middle" class="small">realtime_cpu_id / -1</text>
  <path d="M395 217 V245" class="arrow"/>
  <rect x="290" y="250" width="210" height="67" class="inner" stroke="#93c5fd"/>
  <text x="395" y="276" text-anchor="middle" class="body">SMP 拓扑校验</text>
  <text x="395" y="298" text-anchor="middle" class="small">online / capacity / BSP</text>
  <path d="M395 317 V345" class="arrow"/>
  <rect x="290" y="350" width="210" height="82" class="inner" stroke="#93c5fd"/>
  <text x="395" y="376" text-anchor="middle" class="body">静态 CPU 分区</text>
  <text x="395" y="398" text-anchor="middle" class="small">vCPU/worker → 虚拟化域</text>
  <text x="395" y="418" text-anchor="middle" class="small">spawn_realtime → 实时域</text>

  <path d="M525 267 H570" class="arrow"/>

  <!-- Layer 2 -->
  <rect x="575" y="70" width="260" height="395" class="card" fill="#ecfdf5" stroke="#059669"/>
  <circle cx="613" cy="110" r="22" fill="#059669"/>
  <text x="613" y="118" text-anchor="middle" class="step">2</text>
  <text x="705" y="116" text-anchor="middle" class="label">调度与锁保障</text>
  <rect x="600" y="150" width="210" height="78" class="inner" stroke="#6ee7b7"/>
  <text x="705" y="177" text-anchor="middle" class="body">RT FIFO</text>
  <text x="705" y="199" text-anchor="middle" class="small">高优先级先运行</text>
  <text x="705" y="217" text-anchor="middle" class="small">同优先级保持 FIFO</text>
  <path d="M705 228 V256" class="arrow"/>
  <rect x="600" y="261" width="210" height="92" class="inner" stroke="#6ee7b7"/>
  <text x="705" y="288" text-anchor="middle" class="body">PI mutex</text>
  <text x="705" y="310" text-anchor="middle" class="small">高优先级 waiter donation</text>
  <text x="705" y="330" text-anchor="middle" class="small">owner 重排 / unlock 恢复</text>
  <path d="M705 353 V381" class="arrow"/>
  <rect x="600" y="386" width="210" height="46" class="inner" stroke="#6ee7b7"/>
  <text x="705" y="414" text-anchor="middle" class="body">高优先级任务可推进</text>

  <path d="M835 267 H880" class="arrow"/>

  <!-- Layer 3 -->
  <rect x="885" y="70" width="285" height="395" class="card" fill="#fff7ed" stroke="#ea580c"/>
  <circle cx="923" cy="110" r="22" fill="#ea580c"/>
  <text x="923" y="118" text-anchor="middle" class="step">3</text>
  <text x="1030" y="116" text-anchor="middle" class="label">IRQ 临界区治理</text>
  <rect x="910" y="150" width="235" height="78" class="inner" stroke="#fdba74"/>
  <text x="1027" y="177" text-anchor="middle" class="body">spin-noirq 检测</text>
  <text x="1027" y="199" text-anchor="middle" class="small">per-CPU 持锁时长</text>
  <text x="1027" y="217" text-anchor="middle" class="small">max / violations / callsite</text>
  <path d="M1027 228 V256" class="arrow"/>
  <rect x="910" y="261" width="235" height="92" class="inner" stroke="#fdba74"/>
  <text x="1027" y="288" text-anchor="middle" class="body">锁类型治理</text>
  <text x="1027" y="310" text-anchor="middle" class="small">任务上下文 → PI mutex</text>
  <text x="1027" y="330" text-anchor="middle" class="small">IRQ 共享 → 缩短临界区</text>
  <path d="M1027 353 V381" class="arrow"/>
  <rect x="910" y="386" width="235" height="46" class="inner" stroke="#fdba74"/>
  <text x="1027" y="414" text-anchor="middle" class="body">timer IRQ 可及时响应</text>

  <!-- Evidence lane -->
  <path d="M395 465 V495 M705 465 V495 M1027 465 V495" class="dash"/>
  <rect x="265" y="495" width="905" height="45" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="717" y="516" text-anchor="middle" class="body">证据闭环：CPU 归属日志 · PI 三任务回归 · timer IRQ latency · 高优先级 wake latency</text>
  <text x="717" y="534" text-anchor="middle" class="small">P50 / P99 / max / deadline miss · QEMU 契约验证 + RK3588 实板压力验证</text>
</svg>
