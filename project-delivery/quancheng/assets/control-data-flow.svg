<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">智能侧到实时侧的控制数据流</title>
  <desc id="svg-desc">输入数据经过 AI 推理、协议封装和有界控制通道到达 Axvisor 实时侧，执行后将状态、时间戳和异常回传到智能侧形成闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 700 16px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .body { font: 400 13px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .card { stroke-width: 2; rx: 13; ry: 13; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.4; marker-end: url(#arrow); }
      .return { fill: none; stroke: #0f766e; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="330" fill="#f8fafc"/>

  <rect x="35" y="85" width="135" height="100" class="card" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="102" y="120" text-anchor="middle" class="label">输入数据</text>
  <text x="102" y="148" text-anchor="middle" class="body">图像 / 传感器</text>
  <text x="102" y="168" text-anchor="middle" class="small">样例或板级输入</text>

  <path d="M170 135 H195" class="arrow"/>
  <rect x="200" y="85" width="145" height="100" class="card" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="272" y="120" text-anchor="middle" class="label">AI 推理</text>
  <text x="272" y="148" text-anchor="middle" class="body">模型 / NPU</text>
  <text x="272" y="168" text-anchor="middle" class="small">识别与决策结果</text>

  <path d="M345 135 H370" class="arrow"/>
  <rect x="375" y="85" width="150" height="100" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="450" y="120" text-anchor="middle" class="label">控制指令</text>
  <text x="450" y="148" text-anchor="middle" class="body">语义转换</text>
  <text x="450" y="168" text-anchor="middle" class="small">目标 / 序号 / 时间戳</text>

  <path d="M525 135 H550" class="arrow"/>
  <rect x="555" y="85" width="155" height="100" class="card" fill="#eff6ff" stroke="#2563eb"/>
  <text x="632" y="120" text-anchor="middle" class="label">协议封装</text>
  <text x="632" y="148" text-anchor="middle" class="body">有界消息帧</text>
  <text x="632" y="168" text-anchor="middle" class="small">校验 / 长度 / 错误码</text>

  <path d="M710 135 H735" class="arrow"/>
  <rect x="740" y="85" width="155" height="100" class="card" fill="#fff7ed" stroke="#ea580c"/>
  <text x="817" y="120" text-anchor="middle" class="label">控制通道</text>
  <text x="817" y="148" text-anchor="middle" class="body">mailbox / GIPC</text>
  <text x="817" y="168" text-anchor="middle" class="small">有界传输与通知</text>

  <path d="M895 135 H920" class="arrow"/>
  <rect x="925" y="85" width="145" height="100" class="card" fill="#ecfdf5" stroke="#059669"/>
  <text x="997" y="120" text-anchor="middle" class="label">实时侧接收</text>
  <text x="997" y="148" text-anchor="middle" class="body">Axvisor RT task</text>
  <text x="997" y="168" text-anchor="middle" class="small">pCPU3 / 解析</text>

  <path d="M1070 135 H1095" class="arrow"/>
  <rect x="1100" y="85" width="145" height="100" class="card" fill="#ecfdf5" stroke="#059669"/>
  <text x="1172" y="120" text-anchor="middle" class="label">控制执行</text>
  <text x="1172" y="148" text-anchor="middle" class="body">8ms 控制周期</text>
  <text x="1172" y="168" text-anchor="middle" class="small">动作 / 降级</text>

  <path d="M1172 185 V250 H102 H102" class="return"/>
  <rect x="475" y="225" width="330" height="58" class="card" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="640" y="250" text-anchor="middle" class="label">状态回传与闭环记录</text>
  <text x="640" y="270" text-anchor="middle" class="small">执行结果 / 时间戳 / 异常码 / 策略调整</text>
</svg>
